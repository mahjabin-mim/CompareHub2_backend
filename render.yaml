services:
  - type: web
    name: comparehub2-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    branch: master
    autoDeploy: true
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # No database is provisioned here: Render's free Postgres is deleted 30 days after
      # creation, which took the first deployment down. Public search doesn't need one and
      # the app starts without it. To enable login/saved sources, add a long-lived Postgres
      # (e.g. Neon) in the dashboard as a keyword=value connection string:
      #   ConnectionStrings__DefaultConnection =
      #     Host=...;Database=...;Username=...;Password=...;SSL Mode=Require
      - key: Jwt__Issuer
        value: CompareHub
      - key: Jwt__Audience
        value: CompareHub.Client
      - key: Jwt__SecretKey
        generateValue: true
      # Add more Cors__AllowedOrigins__N entries for any additional origins
      # (e.g. a custom domain, or preview deployment URLs).
      - key: Cors__AllowedOrigins__0
        value: https://comparehub2.vercel.app
